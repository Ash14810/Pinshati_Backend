<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
  <form id="loginForm">
    <input type="text" name="email" id="email" placeholder="Username(email)" required />
    <input type="password" name="password" id="password" placeholder="Password" required />
    <select name="role" id="role" required>
      <option value="consumer-student">Student</option>
      <option value="admin">Enterpranuer</option>
      <option value="wholesaler">Wholesale</option>
      <option value="retailer">Retailer</option>
    </select>
    <button type="submit">Submit</button>
  </form>
<script>
const form = document.getElementById("loginForm");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const role = document.getElementById("role").value;

    try {
      const res = await fetch("http://localhost:3000/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password, role })
      });

      if (!res.ok) throw new Error("Login failed");

      const data = await res.json();
      window.location.href = data.redirect; // Go to correct dashboard
    } catch (err) {
      alert(err.message);
    }
  });
</script>

</body>
</html>
